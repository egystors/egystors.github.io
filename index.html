<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EgyStors</title>
  <style>
    :root { --navy:#0b2a5b; --navy2:#123c82; --gold:#c9a227; --gold2:#a8821a; --silver:#c8ccd4; --bg:#f4f7fb; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Tahoma, Arial, sans-serif; background: var(--bg); color: #1b2333; }
    header { background: linear-gradient(135deg, var(--navy), var(--navy2)); border-bottom: 3px solid var(--gold); padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 5; }
    .brand { display: flex; align-items: center; gap: 12px; }
    #menuBtn { background: none; border: none; color: var(--gold); font-size: 28px; line-height: 1; cursor: pointer; }
    header h1 { font-size: 24px; color: var(--gold); letter-spacing: 1px; }
    #cartBtn { background: var(--gold); color: var(--navy); border: none; padding: 8px 16px; border-radius: 22px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .tools { background: #fff; padding: 12px; border-bottom: 1px solid var(--silver); }
    #search { width: 100%; padding: 11px 14px; border: 1px solid var(--silver); border-radius: 24px; font-size: 15px; font-family: inherit; outline: none; }
    #chips { display: flex; gap: 8px; overflow-x: auto; padding-top: 10px; }
    .chip { flex: none; background: #fff; color: var(--navy); border: 1px solid var(--silver); padding: 6px 16px; border-radius: 18px; font-size: 14px; font-family: inherit; cursor: pointer; }
    .chip.on { background: var(--navy); color: var(--gold); border-color: var(--navy); }
    main { max-width: 1100px; margin: 14px auto; padding: 0 10px; }
    #products { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    @media (min-width: 700px) { #products { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; } }
    .card { background: #fff; border: 1px solid var(--silver); border-radius: 14px; overflow: hidden; box-shadow: 0 2px 8px rgba(11,42,91,0.08); display: flex; flex-direction: column; }
    .card img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; background: #e6e9ef; display: block; }
    .info { padding: 10px; display: flex; flex-direction: column; flex: 1; }
    .name { font-size: 15px; font-weight: bold; color: var(--navy); margin-bottom: 4px; }
    .category { font-size: 12px; color: #7a8394; margin-bottom: 6px; }
    .price { font-size: 17px; color: var(--gold2); font-weight: bold; }
    .stock { font-size: 12px; color: #6b7385; margin: 3px 0 8px; }
    .add { margin-top: auto; width: 100%; background: var(--navy); color: #fff; border: none; padding: 10px; border-radius: 10px; font-size: 14px; font-family: inherit; cursor: pointer; }
    .add:disabled { background: #aab0bd; }
    #message { text-align: center; padding: 40px 10px; font-size: 17px; color: #6b7385; }
    #overlay { display: none; position: fixed; inset: 0; background: rgba(11,42,91,0.55); z-index: 10; }
    #cartPanel { display: none; position: fixed; bottom: 0; left: 0; right: 0; max-height: 88vh; overflow-y: auto; background: #fff; border-top: 4px solid var(--gold); border-radius: 18px 18px 0 0; padding: 16px; z-index: 11; }
    #cartPanel h2 { margin-bottom: 12px; color: var(--navy); }
    .item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #e8ebf1; gap: 8px; }
    .item .controls button { width: 30px; height: 30px; border: 1px solid var(--silver); background: #fff; color: var(--navy); border-radius: 8px; font-size: 17px; cursor: pointer; }
    .item .controls span { margin: 0 8px; font-weight: bold; }
    #total { font-size: 18px; font-weight: bold; color: var(--navy); margin: 12px 0; }
    #cartPanel input, #cartPanel textarea { width: 100%; padding: 11px; margin-bottom: 8px; border: 1px solid var(--silver); border-radius: 10px; font-size: 15px; font-family: inherit; }
    #orderBtn { width: 100%; background: var(--navy); color: var(--gold); border: none; padding: 13px; border-radius: 10px; font-size: 17px; font-weight: bold; font-family: inherit; cursor: pointer; }
    #orderBtn:disabled { background: #aab0bd; color: #fff; }
    #closeBtn { background: none; border: none; color: #7a8394; font-size: 15px; margin-bottom: 8px; cursor: pointer; }
    #status { margin-top: 10px; text-align: center; font-weight: bold; }
    .wa { display: block; margin-top: 12px; background: #25d366; color: #fff; text-decoration: none; padding: 12px; border-radius: 10px; font-size: 17px; font-weight: bold; }
    #menuOverlay { display: none; position: fixed; inset: 0; background: rgba(11,42,91,0.55); z-index: 20; }
    #drawer { display: none; position: fixed; top: 0; bottom: 0; right: 0; width: 75%; max-width: 300px; background: #fff; border-left: 4px solid var(--gold); padding: 16px; z-index: 21; overflow-y: auto; }
    #drawer h2 { color: var(--navy); margin-bottom: 12px; }
    #menuClose { background: none; border: none; color: #7a8394; font-size: 15px; margin-bottom: 8px; cursor: pointer; }
    .mitem { display: block; width: 100%; text-align: right; background: #fff; color: var(--navy); border: none; border-bottom: 1px solid #e8ebf1; padding: 14px 6px; font-size: 16px; font-family: inherit; cursor: pointer; }
    .mitem.on { background: var(--navy); color: var(--gold); border-radius: 8px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <button id="menuBtn" aria-label="القائمة">☰</button>
      <h1>EgyStors</h1>
    </div>
    <button id="cartBtn">السلة (<span id="count">0</span>)</button>
  </header>

  <div class="tools">
    <input id="search" type="search" placeholder="ابحث عن منتج...">
    <div id="chips"></div>
  </div>

  <main>
    <div id="message">جاري تحميل المنتجات...</div>
    <div id="products"></div>
  </main>

  <div id="overlay"></div>
  <div id="cartPanel">
    <button id="closeBtn">✕ إغلاق</button>
    <h2>سلة المشتريات</h2>
    <div id="cartItems"></div>
    <div id="total"></div>
    <input id="custName" placeholder="الاسم">
    <input id="custPhone" placeholder="رقم التليفون" type="tel">
    <textarea id="custAddress" rows="2" placeholder="العنوان"></textarea>
    <button id="orderBtn">تأكيد الطلب</button>
    <div id="status"></div>
  </div>

  <div id="menuOverlay"></div>
  <div id="drawer">
    <button id="menuClose">✕ إغلاق</button>
    <h2>الأقسام</h2>
    <div id="drawerList"></div>
  </div>

  <script type="module" src="app.js"></script>
  <script>
    (function () {
      var menuBtn = document.getElementById('menuBtn');
      var drawer = document.getElementById('drawer');
      var list = document.getElementById('drawerList');
      var ov = document.getElementById('menuOverlay');
      var chips = document.getElementById('chips');

      function openMenu() { drawer.style.display = 'block'; ov.style.display = 'block'; }
      function closeMenu() { drawer.style.display = 'none'; ov.style.display = 'none'; }

      function build() {
        list.innerHTML = '';
        Array.prototype.forEach.call(chips.children, function (c) {
          var b = document.createElement('button');
          b.className = 'mitem' + (c.classList.contains('on') ? ' on' : '');
          b.textContent = c.textContent;
          b.onclick = function () { c.click(); closeMenu(); };
          list.appendChild(b);
        });
      }

      new MutationObserver(build).observe(chips, { childList: true, subtree: true, attributes: true });
      menuBtn.onclick = function () { build(); openMenu(); };
      ov.onclick = closeMenu;
      document.getElementById('menuClose').onclick = closeMenu;
    })();
  </script>
</body>
</html>
